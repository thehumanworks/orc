# Pull requests and pushes to main: typecheck + the test suite on Linux and macOS, and the
# release binaries (build.yml: linux/darwin x x64/arm64), smoke-tested and uploaded as artifacts.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version

      # The npm-installed Pi CLI invokes Node (requires >=22.19.0). Use the same
      # supported LTS version as local contract verification on both test runners.
      - name: Set up Node for Pi
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.19.0'
          package-manager-cache: false

      # Worktree tests commit in temp repos without setting an identity of their own.
      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Exercise the actual Pi RPC/model/auth contracts against local mock endpoints.
      # This separate exact-release install is not shipped in ORC or added to its lockfile.
      - name: Install Pi contract-test runtime
        run: |
          bun scripts/verify-runtime/install-pi-test-tooling.ts "$RUNNER_TEMP/orc-pi-test"
          echo "ORC_TEST_PI_BIN=$RUNNER_TEMP/orc-pi-test/node_modules/.bin/pi" >> "$GITHUB_ENV"

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
        timeout-minutes: 20

  binaries:
    name: binaries
    uses: ./.github/workflows/build.yml
